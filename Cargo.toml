[package]
name = "renderer"
version = "0.1.0"
edition = "2024"
description = "small software rasterizer, olive.c style"

[lib]
path = "src/lib.rs"

[[bin]]
name = "renderer"
path = "src/main.rs"

[features]
default = ["window"]
window = ["dep:x11", "dep:windows-sys"]

[target.'cfg(unix)'.dependencies]
x11 = { version = "2", features = ["xlib"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
debug = 1
